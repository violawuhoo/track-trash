name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test rules
        run: pnpm --filter @haola/game-core test

      - name: Typecheck core
        run: pnpm --filter @haola/game-core typecheck

      - name: Typecheck web
        run: pnpm --filter @haola/web typecheck

      - name: Build web
        run: pnpm --filter @haola/web build
